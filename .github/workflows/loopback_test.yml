name: Loopback transfer test

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loopback:
    name: Loopback transfer (1 seeder, 2 leechers)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE_SIZE_MIB: 20480
      STATS_INTERVAL: 5
      TIMEOUT: 3600
      LOG_DIR: ${{ runner.temp }}/loopback_logs
      WORK_DIR: ${{ runner.temp }}/loopback_work
    steps:
      - name: Show runner resources
        run: |
          nproc
          free -g
          df -h

      - name: checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libssl-dev \
            cmake \
            make \
            libgrpc-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler-grpc \
            libtorrent-rasterbar-dev \
            libboost-program-options-dev \
            libspdlog-dev \
            python3-libtorrent \
            python3-grpcio \
            python3-grpc-tools \
            openssl

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Run loopback test
        run: tests/ci/loopback_queue_depth.sh

      - name: Write job summary
        if: always()
        run: |
          if [ -f "$LOG_DIR/summary.md" ]; then
            cat "$LOG_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary: the test stopped before the transfer." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loopback-logs
          path: ${{ runner.temp }}/loopback_logs
          retention-days: 7
          if-no-files-found: warn
