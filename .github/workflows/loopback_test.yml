name: Loopback transfer test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      image_size_mib:
        description: 'Image size in MiB for the release job'
        required: false
        default: '8192'

permissions:
  contents: read

jobs:
  loopback:
    name: Loopback (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            build_type: Release
            tsan: 'OFF'
            image_mib: 8192
          # Debug keeps the asserts on; TSan is slow, so the image is smaller.
          - variant: tsan
            build_type: Debug
            tsan: 'ON'
            image_mib: 2048
    env:
      IMAGE_SIZE_MIB: ${{ matrix.variant == 'release' && inputs.image_size_mib || matrix.image_mib }}
      EZIO_TSAN: ${{ matrix.tsan == 'ON' && '1' || '0' }}
      STATS_INTERVAL: 5
      TIMEOUT: 900
    steps:
      - name: Set dirs and show runner resources
        run: |
          echo "LOG_DIR=$RUNNER_TEMP/loopback_logs" >> "$GITHUB_ENV"
          echo "WORK_DIR=$RUNNER_TEMP/loopback_work" >> "$GITHUB_ENV"
          nproc
          free -g
          df -h "$RUNNER_TEMP"

      - name: Allow ThreadSanitizer shadow memory
        if: matrix.tsan == 'ON'
        # TSan cannot map its shadow memory with the default ASLR entropy.
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libssl-dev \
            cmake \
            make \
            libgrpc-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler-grpc \
            libtorrent-rasterbar-dev \
            libboost-program-options-dev \
            libspdlog-dev \
            python3-libtorrent \
            python3-grpcio \
            python3-grpc-tools \
            openssl \
            opentracker
          # The test starts its own opentracker on another port.
          sudo systemctl stop opentracker || true

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DEZIO_SANITIZE_THREAD=${{ matrix.tsan }}
          cmake --build build -j"$(nproc)"

      - name: Run loopback test
        run: tests/ci/loopback_test.sh

      - name: Write job summary
        if: always()
        run: |
          if [ -f "$LOG_DIR/summary.md" ]; then
            echo "Job: ${{ matrix.variant }}" >> "$GITHUB_STEP_SUMMARY"
            cat "$LOG_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary (${{ matrix.variant }}): the test stopped before the transfer." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loopback-logs-${{ matrix.variant }}
          path: ${{ runner.temp }}/loopback_logs
          retention-days: 7
          if-no-files-found: warn
