version: 2

updates:
  # Keep the SHA-pinned actions in .github/workflows/ fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  # gRPC client helpers under utils/
  - package-ecosystem: pip
    directory: /utils
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    labels:
      - dependencies
